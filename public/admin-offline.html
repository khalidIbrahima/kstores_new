<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#111827">
<meta name="robots" content="noindex">
<title>Hors ligne · Kapital Stores Admin</title>
<link rel="icon" href="/icons/favicon.svg" type="image/svg+xml">
<style>
  :root { color-scheme: dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; min-height: 100%; }
  body {
    min-height: 100vh; min-height: 100dvh;
    display: flex; align-items: center; justify-content: center;
    padding: max(24px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(24px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
    background: #060a13; color: #d1d5db;
    font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  }
  main { width: 100%; max-width: 420px; text-align: center; }
  img { width: 88px; height: 88px; border-radius: 20px; }
  h1 { margin: 20px 0 8px; font-size: 1.375rem; color: #fff; }
  p { margin: 0 0 24px; line-height: 1.5; font-size: 0.95rem; }
  button {
    appearance: none; border: 0; cursor: pointer;
    background: #22c55e; color: #000; font-weight: 600; font-size: 0.95rem;
    padding: 12px 22px; border-radius: 12px; min-width: 180px;
  }
  button:hover { background: #4ade80; }
  small { display: block; margin-top: 18px; color: #6b7280; font-size: 0.8rem; }
</style>
</head>
<body>
<main>
  <img src="/icons/icon-192.png" alt="Kapital Stores">
  <h1>Vous êtes hors ligne</h1>
  <p>L'administration de Kapital Stores a besoin d'une connexion pour afficher les commandes, les produits et les paiements à jour.</p>
  <button type="button" onclick="location.reload()">Réessayer</button>
  <small>La page se recharge automatiquement dès que la connexion revient.</small>
</main>
<script>window.addEventListener('online', function () { location.reload() })</script>
</body>
</html>
